name: mobile_money_tracker
description: Suivi automatique des transactions Orange Money / MTN Mobile Money via analyse des SMS.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Base de données locale SQLite via Drift (génération de code avec build_runner,
  # voir Phase 2 : la base locale reste la source de vérité immédiate, même hors-ligne)
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path: ^1.9.0
  path_provider: ^2.1.4

  # Synchronisation cloud (Phase 2)
  supabase_flutter: ^2.17.2
  connectivity_plus: ^7.3.1

  # Utilitaires
  intl: ^0.19.0
  uuid: ^4.4.2

  # Graphiques pour le dashboard
  fl_chart: ^0.68.0

  # Export
  csv: ^6.0.0
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.2

  # Lecture des SMS Android (scaffold — à tester sur un vrai appareil)
  # Fork maintenu de `telephony` (abandonné, incompatible AGP 8+ : pas de namespace)
  another_telephony: ^0.4.1
  permission_handler: ^11.3.1

  # Saisie manuelle de transaction + photo de reçu (voir
  # lib/screens/add_transaction_screen.dart et
  # lib/services/receipt_extraction_service.dart).
  image_picker: ^1.1.2
  # Préférence locale : modèle IA choisi pour l'extraction de reçu (voir
  # lib/services/ai_model.dart). Déjà tiré en transitif par d'autres
  # plugins, listé ici explicitement car utilisé directement par l'app.
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  mocktail: ^1.0.4
  # Utilisé uniquement dans les tests pour construire des Session/User factices
  # (déjà tiré en transitif par supabase_flutter -> gotrue, mais listé ici
  # explicitement pour pouvoir l'importer directement dans test/).
  gotrue: ^2.27.2
  # Client Postgrest/RPC pur Dart (déjà tiré en transitif par
  # supabase_flutter), utilisé par le test de connexion backend
  # (test/backend/) pour appeler le vrai projet Supabase sans dépendre des
  # bindings Flutter.
  supabase: ^2.16.1

flutter:
  uses-material-design: true
